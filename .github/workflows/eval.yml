name: Eval Smoke

on:
  push:
    branches: [main]
    paths:
      - "python-impl/**"
      - ".github/workflows/eval.yml"
  pull_request:
    branches: [main]
    paths:
      - "python-impl/**"

jobs:
  eval-smoke:
    name: Eval Smoke (10 cases per dataset)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-impl

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: python-impl/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          APP_ENV: test
          RAG_USE_LOCAL_FALLBACK: "true"
        run: |
          python -m pytest tests/ -x -q --tb=short

      - name: Run eval smoke (10 per dataset)
        env:
          APP_ENV: test
          RAG_USE_LOCAL_FALLBACK: "true"
        run: |
          python -m eval.runner --smoke --output /tmp/eval_smoke.json
          echo "Eval smoke completed"

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-smoke-results
          path: /tmp/eval_smoke.json
          retention-days: 7
